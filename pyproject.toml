[project]
name = "moodsic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dj-database-url==3.1.2",
    "django==6.0.4",
    "django-allauth==65.16.1",
    "django-cities-light==3.11",
    "django-countries==8.2.0",
    "django-environ==0.13.0",
    "django-ninja==1.6.2",
    "django-unfold==0.90.0",
    "djangorestframework>=3.17.1",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy==2.4.4",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]==3.3.3",
    "pydantic==2.13.3",
    "python-dotenv>=1.2.2",
    "redis==7.4.0",
    "requests==2.33.1",
    "scikit-learn>=1.8.0",
    "spotipy==2.26.0", # Librería para consumir de la API de Spotify.
    "tensorflow>=2.21.0",
    "torch>=2.11.0",
    "virtualenv==21.2.4",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "coverage==7.13.5",
    "pre-commit==4.5.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-django==4.12.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.11",
    "ty==0.0.31",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "__pypackages__",
    "migrations",
    "staticfiles",
    "media",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "C90",  # mccabe
    "B",    # flake8-bugbear
    "DJ",   # flake8-django
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "DTZ",  # flake8-datetimez
    "Q",    # flake8-quotes
    "S",    # flake8-bandit
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501", # line length handled by formatter
    "PLC0415", # Local imports are common in Django to avoid circular dependencies
    "RUF012", # Mutable class attributes are standard in Django models/admin
    "ARG001", # Unused function arguments are common in Django signals/overrides
    "ARG002", # Unused method arguments are common in Django signals/overrides
    "PLR2004", # Magic values are common in business logic and tests
    "DJ001", # Nullable string fields are sometimes intentional
    "BLE001", # Blind except Exception: is common in Django views
    "S110", # try-except-pass is common for optional integrations
    "N806", # Variable names like User = get_user_model() are standard
    "SLF001", # Accessing private members like _meta is common in Django
    "PLW0603", # Global statement is used for service singletons
    "S311", # Standard random is used for seeding/reproducibility
    "S603", # Subprocess call with untrusted input
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR0912", # Too many branches
    "C901", # Complex structure
    "PLR0911", # Too many return statements
    "S105", # Possible hardcoded password (false positives in reports)
    "S106", # Possible hardcoded password (intentional in seeding)
    "UP038", # Use X | Y in isinstance is optional and can be noisy
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "S101", # asserts are okay in tests
    "S105", # hardcoded passwords are okay in tests
    "S106", # hardcoded passwords are okay in tests
    "ARG005", # unused lambda arguments are okay in tests
]

[tool.ruff.lint.isort]
known-first-party = ["raikojin"]
known-third-party = ["django", "django_environ", "dj_database_url", "django_unfold"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 12
max-statements = 100
max-branches = 20

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
