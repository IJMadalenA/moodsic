{% extends "base.html" %}

{% block title %}404 — Página no encontrada · MoodSic{% endblock %}

{% block content %}
<div class="card" style="text-align:center;padding:64px 32px;">
    <div style="font-size:5rem;margin-bottom:16px;">🎵</div>
    <h1 style="font-size:3rem;color:#22c55e;margin-bottom:8px;">404</h1>
    <h2 style="color:#e5e7eb;margin-bottom:16px;">Página no encontrada</h2>
    <p class="muted" style="max-width:400px;margin:0 auto 32px;">
        La pista que buscas no existe en nuestra biblioteca.
        Quizás fue eliminada o la URL es incorrecta.
    </p>
    <a href="/" style="
        display:inline-block;
        padding:12px 28px;
        background:#22c55e;
        color:#0f172a;
        border-radius:999px;
        font-weight:600;
        text-decoration:none;
    ">Volver al inicio</a>
</div>
{% endblock %}
