<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MoodSic{% endblock %}</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --panel-soft: #1f2937;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --accent: #22c55e;
            --accent-soft: #153b2b;
            --warning: #f59e0b;
            --border: #243041;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
            color: var(--text);
        }
        a { color: #93c5fd; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .shell { max-width: 1120px; margin: 0 auto; padding: 24px; }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding: 16px 0;
        }
        .brand { font-size: 1.4rem; font-weight: 700; color: white; }
        .brand small { display: block; font-size: 0.8rem; color: var(--muted); font-weight: 400; }
        .navlinks { display: flex; gap: 14px; flex-wrap: wrap; }
        .navlinks a {
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
        }
        .card {
            background: rgba(17, 24, 39, 0.92);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            background: var(--accent-soft);
            color: #bbf7d0;
        }
        .badge.warning { background: #422006; color: #fde68a; }
        .muted { color: var(--muted); }
        h1, h2, h3 { margin-top: 0; }
        main { padding-bottom: 32px; }
    </style>
</head>
<body>
    <div class="shell">
        <nav class="topbar">
            <div class="brand">
                MoodSic
                <small>Recomendación musical contextual con modo offline y online</small>
            </div>
            <div class="navlinks">
                <a href="/">Inicio</a>
                <a href="/dashboard/">Dashboard</a>
                <a href="/api/interactions/docs/">Swagger</a>
                <a href="/admin/">Admin</a>
            </div>
        </nav>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
